<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StruttureMenni</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/results.css">
  <link rel="stylesheet" href="css/registro.css">
  <link rel="stylesheet" href="css/progetti.css">
  <link rel="stylesheet" href="css/confronto.css">
  <link rel="stylesheet" href="css/chart.css">
  <link rel="stylesheet" href="css/sketch.css">
  <link rel="stylesheet" href="css/midas.css">
  <link rel="stylesheet" href="css/relazione-overlay.css">
  <link rel="stylesheet" href="css/relazione-formule.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <div id="app" data-pane="dati" data-view="home">
    <header class="app-header">
      <h1 class="app-h1">StruttureMenni</h1>
      <!-- Review: the header search field is removed -- search already lives in the rail's own
           "Cerca" destination, on Home and on Ctrl/Cmd+K (js/palette.js); it also broke the
           390px header, forcing it to wrap. -->
      <!-- WORKBENCH_SPEC §14.1: the project picker, left of "Calcolo automatico" -- js/progetto-
           picker.js renders into this mount point (js/main.js `initProgettoPicker`). -->
      <div id="progetto-picker-root" class="pp-root"></div>
      <label class="app-live-toggle" for="live-toggle">
        <input type="checkbox" id="live-toggle" checked>
        <span>Calcolo automatico</span>
      </label>
    </header>

    <details class="app-picker">
      <summary>Strumenti</summary>
    </details>

    <nav id="tool-index" class="rail" aria-label="Navigazione strumenti"></nav>

    <main id="home-pane" aria-label="Home"></main>

    <main id="registro-pane" aria-label="Registro correzioni"></main>

    <main id="progetti-pane" aria-label="Progetti"></main>

    <div class="app-tablist" role="tablist">
      <button type="button" class="app-tab" id="tab-dati" role="tab" aria-selected="true" aria-controls="form-pane">Dati</button>
      <button type="button" class="app-tab" id="tab-risultati" role="tab" aria-selected="false" aria-controls="results-pane">Risultati</button>
    </div>

    <div id="form-pane">
      <h2 id="tool-title" tabindex="-1"></h2>
      <div id="tool-registro-indicator"></div>
      <div id="form-root"></div>
      <div id="run-error" role="alert" hidden></div>
      <div id="error-summary" role="alert" tabindex="-1" hidden></div>
      <div id="form-actions"></div>
    </div>

    <div id="results-pane" hidden>
      <div id="sintesi" aria-live="polite" aria-atomic="false"></div>
      <div id="results-root"></div>
    </div>

    <button type="button" id="bottom-bar" hidden aria-label="Vai ai risultati"></button>
  </div>

  <div id="palette-root"></div>
  <div id="shortcuts-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
